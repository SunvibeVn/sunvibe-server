name: CI

on:
  pull_request:
  push:
    branches: [main]

# No job writes to the repository (survey-media security review M-5); a job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6   # Gradle cache
      - run: ./gradlew build --no-daemon
      # The wire check's report: what the API tests reached, with null and value counts. Also when the build fails.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wire-contract
          path: app/build/reports/wire-contract/
          retention-days: 14
      # The checked-in contract must equal what the code exports (H2 test profile, no database needed).
      - name: API contract is fresh (exportOpenApi output equals api/openapi.json)
        run: |
          ./gradlew exportOpenApi --no-daemon
          git diff --exit-code -- api/openapi.json || {
            echo "::error file=api/openapi.json::api/openapi.json is stale: run ./gradlew exportOpenApi and commit it."
            exit 1
          }

  # survey-media plan PD-7: the ClamAV adapter and the clamd boundary against a real clamd container. Its own job:
  # the image loads its signatures at start, which the build does not wait for.
  real-clamd:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:realClamdTest --no-daemon

  migration-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the base branch and the fork point are needed
      - name: Committed Flyway migrations are unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bash scripts/ci/check-migration-history.sh "$BASE"

  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Claude/Codex hooks and CI scripts (temporary Git repos only).
      - run: node --test "scripts/tests/*.test.mjs"

name: Secret scan

# Backs .claude/rules/security.md (no literal secrets) and ADR-002 (CI secret scan).
# Scans only the new commits of a PR (base..head) or a push to main (before..after) with the gitleaks CLI.
# Known history findings are listed by fingerprint in .gitleaksignore. --redact keeps secret values out of the logs.
# Never add --log-level debug: it prints decoded fragments of matches.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs replace each other (each one scans the whole base..head). Push runs never do, or commits would be skipped.
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # 'trusted' is the commit whose .gitleaksignore applies: a PR cannot add exceptions for its own commits.
          if [ "$EVENT" = "pull_request" ]; then
            from="$PR_BASE"; to="$PR_HEAD"; trusted="$PR_BASE"
          else
            from="$PUSH_BEFORE"; to="$PUSH_AFTER"; trusted="$PUSH_AFTER"
          fi
          for sha in "$from" "$to"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected commit id: '$sha'"; exit 1; }
          done
          git rev-parse --verify --quiet "${to}^{commit}" >/dev/null || { echo "::error::Commit $to is not in the clone"; exit 1; }
          # 'from' is all zeros (new branch) or missing from the clone (force push, rewritten base): scan all of 'to'.
          if [[ "$from" =~ ^0+$ ]] || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
            range="$to"
          else
            range="${from}..${to}"
          fi
          git rev-list "$range" >/dev/null   # fail here, not silently inside gitleaks, if git cannot read the range
          echo "Scanning commits: $range"

          # Pinned config and ignore list: files from the checked-out PR must not change what is scanned.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          git show "${trusted}:.gitleaksignore" > "$RUNNER_TEMP/gitleaksignore" 2>/dev/null || : > "$RUNNER_TEMP/gitleaksignore"
          rm -f .gitleaks.toml .gitleaksignore   # gitleaks also auto-loads these from the scanned folder

          # --diff-merges=remerge: also scan content added while resolving a merge.
          # --ignore-gitleaks-allow: exceptions go through .gitleaksignore (reviewed), not inline comments.
          rc=0
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--diff-merges=remerge $range" \
            --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore" \
            --redact --verbose --no-banner --no-color --ignore-gitleaks-allow --exit-code 1 \
            2> "$RUNNER_TEMP/gitleaks.log" || rc=$?
          cat "$RUNNER_TEMP/gitleaks.log" >&2
          # gitleaks exits 0 when git log fails ("0 commits scanned"): fail closed on any error line.
          if grep -qw ERR "$RUNNER_TEMP/gitleaks.log"; then echo "::error::gitleaks reported an error"; exit 1; fi
          exit "$rc"

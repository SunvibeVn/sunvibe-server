spring:
  application:
    name: sunvibe-server
  jpa:
      hibernate:
        ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: info.jasmine@gmail.com
    password: egrpxvajcgdvqwmu
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  config:
    import:

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sunvibe_core}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: sunvibe-server
  jpa:
      hibernate:
        ddl-auto: validate
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  config:
    import:

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sunvibe_core}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        # PostgreSQL error messages leave out the failing row and key values, so a constraint violation never
        # writes personal data (name, phone, email, address) to the logs; the constraint name is still logged
        logServerErrorDetail: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # Puts the request correlation id (ADR-010) in front of every log message
    correlation: "[%X{correlationId:-}] "
  level:
    vn.sunvibe: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
# ── App / Security ────────────────────────────────────────────
app:
  cors:
    allowed-origins: http://localhost:3000
  auth:
    refresh-cookie:
      # Browser-session refresh cookie, only sent to /api/v1/auth/session (auth-browser-session spec §3.5).
      # Renamed __Secure-sv_refresh in prod; Secure is off only in the lan profile.
      name: sv_refresh
      secure: true
  jwt:
    secret: ${JWT_SECRET}
    expiration:
      # Short-lived on purpose: clients renew it silently via POST /api/v1/auth/session/refresh
      minutes: 15
    # Refresh token idle lifetime (7 days): unused this long, the session ends. Each refresh restarts it.
    jwtRefreshExpirationMs: 604800000
    # Absolute session lifetime (30 days) after login, however active the user is
    refreshAbsoluteExpirationMs: 2592000000
    # A rotated refresh token presented again within this window is a benign race (two tabs), not theft
    refreshReuseGraceSeconds: 30
    # Daily deletion of expired refresh tokens
    refreshCleanupCron: "0 30 3 * * *"
  security:
    login:
      # Every 5th consecutive wrong password locks password login: 15 min, then 30, 60... up to 24 h
      max-failed-attempts: 5
      lock-duration: 15m
      max-lock-duration: 24h
    password-reset:
      # Wrong OTP codes a reset token tolerates before it is burned
      max-otp-attempts: 5
      # Minimum time between two reset e-mails to the same address
      resend-cooldown: 60s
      # Reset codes per e-mail/phone per 24 h (5 codes x 5 guesses = 25 OTP tries a day at most)
      max-codes-per-day: 5
    verification:
      # Phone (SMS) / e-mail verification codes
      code-lifetime: 10m
      max-attempts: 5
      resend-cooldown: 60s
      max-codes-per-day: 5
      # PENDING accounts whose phone is still unverified this long after registration are
      # deactivated (soft-deleted, freeing the number) by a daily job
      pending-account-ttl: 7d
      pending-cleanup-cron: "0 15 3 * * *"
      # Single-use token handed out once a registering phone number is verified; registration must present it
      registration-token-lifetime: 15m
      # Expired pre-registration phone challenges are deleted daily at this time
      registration-cleanup-cron: "0 45 3 * * *"
    registration:
      # "Verify first, register later": registration needs a token proving the phone number. Set to false
      # (REGISTRATION_REQUIRE_PHONE_VERIFICATION=false) while clients still use the old register-then-verify flow.
      require-phone-verification: ${REGISTRATION_REQUIRE_PHONE_VERIFICATION:true}
    audit:
      # Security audit log (auth_audit_events): kept this long, purged daily at cleanup-cron
      retention: 180d
      cleanup-cron: "0 0 4 * * *"
    rate-limit:
      # Per client IP (in-memory: per application instance). Behind a reverse proxy,
      # set server.forward-headers-strategy so the real client IP is used.
      enabled: true
      # Each auth rule names its bucket (auth-browser-session spec 3.8). Logout, logout-all and GET /api/v1/me
      # have no limit.
      rules:
        - { method: POST, path: /api/v1/auth/login, limit: 10, window: 1m, bucket: login }
        - { method: POST, path: /api/v1/auth/registration, limit: 5, window: 1h, bucket: registration }
        - { method: POST, path: /api/v1/auth/password-reset/email, limit: 5, window: 1h, bucket: reset-email }
        - { method: POST, path: /api/v1/auth/password-reset/sms, limit: 5, window: 1h, bucket: reset-sms }
        - { method: POST, path: /api/v1/auth/registration/phone/send-code, limit: 5, window: 1h, bucket: registration-send-code }
        - { method: POST, path: /api/v1/auth/registration/phone/verify-code, limit: 10, window: 15m, bucket: registration-verify-code }
        - { method: POST, path: /api/v1/me/verification/phone/send-code, limit: 5, window: 1h, bucket: verify-phone-send }
        - { method: POST, path: /api/v1/me/verification/email/send-code, limit: 5, window: 1h, bucket: verify-email-send }
        - { method: POST, path: /api/v1/me/verification/phone/confirm-code, limit: 10, window: 15m, bucket: verify-phone-confirm }
        - { method: POST, path: /api/v1/me/verification/email/confirm-code, limit: 10, window: 15m, bucket: verify-email-confirm }
        - { method: POST, path: /api/v1/auth/password-reset/complete, limit: 10, window: 15m, bucket: reset-complete }
        - { method: POST, path: /api/v1/auth/session/refresh, limit: 30, window: 1m, bucket: refresh }
        - { method: POST, path: /api/v1/me/password/change, limit: 10, window: 15m, bucket: password-change }
        # Public owner intake form (acquisition-owner-intake): 10 submissions per client IP per hour
        - { method: POST, path: /api/v1/public/owner-intake-requests, limit: 10, window: 1h }
  sms:
    # SMS provider for OTPs. No default on purpose: without one the app does not start.
    # Only "log" exists so far (dev/test profiles; prints OTPs to the log, never use in prod).
    provider: ${SMS_PROVIDER:}
  crypto:
    # No defaults on purpose: startup fails unless both are set. Each must be a
    # base64-encoded 32-byte key, and the two must differ. Dev/test values live
    # in application-dev.yml / application-test.yml and must never be used in prod.
    id-card-key: ${ID_CARD_CRYPTO_KEY}
    id-card-index-key: ${ID_CARD_CRYPTO_INDEX_KEY}
  acquisition:
    # No default on purpose: startup fails unless it is set. A base64-encoded key of at least 32 bytes that
    # signs the IP and user agent hashes kept as consent proof. The dev/test value lives in
    # application-dev.yml / application-test.yml and must never be used in prod.
    hash-key: ${ACQUISITION_HASH_KEY}
    owner-intake:
      # Off by default: the public intake form must not take real owners' data before the staff queue UI exists
      # and the consent text has passed legal review (acquisition-owner-intake BR-15, Q-11). While off, the POST
      # answers 404; the ward catalog stays open. Turn on per environment with ACQUISITION_OWNER_INTAKE_ENABLED=true.
      enabled: ${ACQUISITION_OWNER_INTAKE_ENABLED:false}
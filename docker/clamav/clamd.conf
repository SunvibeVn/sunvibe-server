# clamd for survey-media (spec 4.5 scan row, A-7, A-27; ADR-011 decision 4)
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LocalSocket /run/clamav/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
# At least the worker's scan concurrency (2 per instance) plus 1 for the probe, summed over the instances using it
MaxThreads 8
StreamMaxLength 25M
MaxScanSize 100M
MaxFileSize 25M
# Under the API's clamd read timeout (app.survey.media.clamav.timeout, 30 s) by 10 s: a slow scan is answered as a
# per-file limit before the client gives up (spec A-7; ClamdTimeoutRelationTest)
MaxScanTime 20000
# A limit hit is reported (Heuristics.Limits.Exceeded.*): the worker treats it as a per-file condition
AlertExceedsMax yes
AlertBrokenMedia no
AlertEncrypted no
AlertEncryptedArchive no
AlertEncryptedDoc no
DetectPUA no
# VirusEvent stays unset: clamd logs a detection itself; the worker writes the one security event

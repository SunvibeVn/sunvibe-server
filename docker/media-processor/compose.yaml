# The production form of the survey-media processor (ADR-011 decision 4 form (a); survey-media spec 4.5, A-27;
# plan PD-1). Operators run it beside the API: the API joins the internal network "media-processing", which holds
# nothing but the API and this container, and sets
#   app.survey.media.processor.kind=isolated
#   app.survey.media.processor.host=media-processor
#   app.survey.media.processor.port=7300
#   app.survey.media.processor.version=<this image's digest>
# The container has no egress (internal network), no secret (no environment beyond the image's), a read-only root, a
# tmpfs work area, no new privileges, the default seccomp profile, no IPC namespace sharing, every capability dropped
# but the supervisor's SETUID, SETGID, CHOWN and KILL (each run slot runs as its own uid without any), and process, memory and CPU limits; the
# memory limit is at least the sum of the run limits: 2 worker runs and the probe at 1.5 GiB each (spec A-27).
services:
  media-processor:
    build: .
    image: sunvibe/media-processor:local
    read_only: true
    tmpfs:
      - /work:size=1g,mode=0711,uid=0,gid=0
    # the supervisor starts as root with four capabilities to run each slot as its own uid in its own directory and
    # to end every process of a slot between runs; the runs (the decoders) get none (security review M-1, SV-069)
    user: "0:0"
    # an init as process 1 reaps what a killed run leaves behind, so no zombie holds a pid (pids_limit)
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    # no /dev/shm; System V shared memory, message queues and semaphores are switched off in the container's own IPC
    # namespace, so nothing of a run outlives its reset there (POSIX queues are removed by the reset)
    ipc: none
    sysctls:
      kernel.shmmni: 0
      kernel.msgmni: 0
      kernel.sem: "0 0 0 0"
    # 3 slots of at most 16 processes each (prlimit --nproc, counted per uid on the host) and the supervisor's threads
    pids_limit: 96
    mem_limit: 5g
    memswap_limit: 5g
    cpus: 2
    restart: unless-stopped
    command: ["--listen", "tcp:0.0.0.0:7300"]
    networks:
      - media-processing

networks:
  media-processing:
    internal: true
